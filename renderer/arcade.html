<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>Buddy Arcade</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;color:#e8f4ff}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #drag{position:absolute;left:60px;right:60px;top:0;height:26px;-webkit-app-region:drag;z-index:5}
  #close{position:absolute;right:30px;top:28px;width:26px;height:26px;border-radius:50%;border:1px solid #9fe6ff66;background:#0a1440aa;color:#bfe9ff;font-size:15px;cursor:pointer;z-index:6;
    backdrop-filter:blur(6px);box-shadow:0 0 12px #3fb5ff55;line-height:22px;padding:0;transition:.2s}
  #close:hover{background:#ff4f8b55;color:#fff;border-color:#ff9bd0}
  .ov{position:absolute;left:20px;top:20px;width:720px;height:500px;display:flex;align-items:center;justify-content:center;z-index:4}
  .card{min-width:440px;max-width:560px;padding:26px 32px;border-radius:24px;text-align:center;background:linear-gradient(160deg,#1a2a7a33,#0a0f3a55);
    border:1px solid #9fe6ff40;box-shadow:0 0 40px #3fb5ff33,inset 0 0 30px #7b5cff22;backdrop-filter:blur(10px) saturate(1.3);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  .card h1{margin:0 0 6px;font-weight:300;font-size:30px;letter-spacing:.14em;text-transform:uppercase;
    background:linear-gradient(90deg,#9fe6ff,#e6b8ff,#ffd6f0);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #7ad7ff88)}
  .card .sub{font-size:11px;letter-spacing:.3em;color:#7fb6ff;text-transform:uppercase;margin-bottom:12px}
  .card p{margin:8px 0;color:#c8dcff;font-size:14px;line-height:1.5;font-weight:400}
  .card .taunt{color:#ffe08a;font-weight:600;text-shadow:0 0 12px #ffb84d88;min-height:22px}
  .card .style{color:#9fe6ff;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .card button{position:relative;border:1px solid #9fe6ff66;background:#0b1850aa;color:#e8f4ff;font:600 13px "Segoe UI",system-ui;letter-spacing:.06em;border-radius:999px;padding:10px 20px;cursor:pointer;
    box-shadow:0 0 14px #3fb5ff33,inset 0 0 12px #3fb5ff22;transition:.18s}
  .card button:hover{border-color:#e6b8ff;box-shadow:0 0 22px #b48cff88,inset 0 0 16px #b48cff44;transform:translateY(-1px)}
  .card button.go{background:linear-gradient(90deg,#2fb6ff,#9a6bff);border-color:transparent;color:#fff;box-shadow:0 0 24px #6aa8ffaa}
  .games{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .games button{border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
  .games button i{font-style:normal;font-size:26px;filter:drop-shadow(0 0 8px #9fe6ff)}
  .keys{font-size:12px;color:#8fb0e8;margin-top:6px}
  .keys b{display:inline-block;border:1px solid #9fe6ff44;border-radius:6px;padding:0 6px;margin:0 1px;color:#e8f4ff;font-weight:600;background:#ffffff0d}
  .card .help{font-size:12.5px;color:#a9c3ee;margin:6px 0}
  .card h1{font-size:26px}
  .design{margin:10px 0 6px;padding:10px 14px;border-radius:16px;border:1px solid #b48cff55;background:linear-gradient(160deg,#2a1a7a33,#0a144044);box-shadow:inset 0 0 18px #7b5cff22;text-align:center}
  .dz-by{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#bda6ff}
  .dz-name{font-size:19px;font-weight:600;letter-spacing:.06em;color:#fff;text-shadow:0 0 14px #b48cffaa;margin:2px 0}
  .dz-twist{font-size:13px;color:#9fe6ff}
  .dz-habit{font-size:13px;color:#ffe08a;font-style:italic;margin-top:4px}
  .dz-why{font-size:11.5px;color:#8fb0e8;margin-top:2px}
  .dz-knobs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .dz-knobs span{font-size:11px;border-radius:99px;padding:1px 8px;border:1px solid #ffffff22;background:#ffffff0a}
  .dz-knobs .up{color:#ffb3c8;border-color:#ff7ad955}.dz-knobs .down{color:#9dffcf;border-color:#58f0c855}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="drag"></div><button id="close" title="Close (Esc)">✕</button>
<div id="menu" class="ov hidden"></div>
<div id="over" class="ov hidden"></div>
<script src="arcade-design.js"></script>
<script src="arcade.js"></script>
</body>
</html>
